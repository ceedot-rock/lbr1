[package]
name = "splb"
version = "0.1.0"
edition = "2021"
description = "PCC crate (splb) — TRU8/TR8X/LBR1 house, pulsar BW22 for text. Not Combined GC."
license = "UNLICENSED"
publish = false

[lib]
name = "splb"
path = "src/lib.rs"

[[bin]]
name = "lb"
path = "src/bin/lb.rs"

[profile.release]
lto = false
codegen-units = 1
opt-level = 3

[dependencies]
pulsar = { path = "../speed-cmp/pulsar-best" }
lbr1_price = { path = "../lbr1_price" }

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "lb-force-long"
path = "src/bin/lb_force_long.rs"
