[package]
name = "splb"
version = "0.1.0"
edition = "2021"
description = "PCC / ASMD. UNLICENSED. Not published."
license = "AGPL-3.0-or-later"
publish = false

[features]
default = ["aware"]
aware = ["dep:combined-gc"]

[lib]
name = "splb"
path = "src/lib.rs"

[[bin]]
name = "lb"
path = "src/bin/lb.rs"

[profile.release]
lto = false
codegen-units = 1
opt-level = 3

[dependencies]
pulsar = { path = "../speed-cmp/pulsar-best" }
lbr1_price = { path = "../lbr1_price" }
combined-gc = { path = "../../combined-gc", optional = true }

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "lb-force-long"
path = "src/bin/lb_force_long.rs"
