[package]
name = "leftbrain"
version = "0.1.0"
edition = "2021"
description = "Left brain: own LZ match parser + rANS for binaries. Pair with BWT right brain."
license = "UNLICENSED"
publish = false

[lib]
name = "leftbrain"
path = "src/lib.rs"

[[bin]]
name = "lb"
path = "src/bin/lb.rs"

[profile.release]
lto = false
codegen-units = 1
opt-level = 3

[dependencies]
pulsar = { path = "../speed-cmp/pulsar-best" }
lbr1_price = { path = "../lbr1_price" }

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "lb-force-long"
path = "src/bin/lb_force_long.rs"
