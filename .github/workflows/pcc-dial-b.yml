# PCC Dial B — compile + FAIL_LOUD note.
# Full mozilla gate is local (51 MiB corpus); CI verifies the dial builds.
name: pcc-dial-b

on:
  push:
    branches: [main, "pcc/**", "aware/**"]
  pull_request:
    branches: [main]

jobs:
  dial-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: build Dial B profile example
        run: cargo build --release -p splb --example profile_ml4_hot
      - name: FAIL_LOUD note present
        run: |
          test -f bench/pcc-dial-b-fail-loud.md
          grep -q '16,735,963' bench/pcc-dial-b-fail-loud.md
          grep -q 'WINDOW=524288\|W=512KiB' bench/pcc-dial-b-fail-loud.md
          grep -q 'CHAIN=8' bench/pcc-dial-b-fail-loud.md
      - name: mozilla FAIL_LOUD (optional corpus)
        if: ${{ hashFiles('corpora/silesia-members/mozilla') != '' }}
        run: ./bench/pcc-dial-b-fail-loud.sh corpora/silesia-members/mozilla
